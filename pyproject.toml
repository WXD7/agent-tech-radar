[project]
name = "agent-tech-radar"
version = "1.1.0"
description = "A dual-input technology knowledge graph powered by AI conversations, passive radar discovery, evidence, and experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
agent-radar = "radar.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
