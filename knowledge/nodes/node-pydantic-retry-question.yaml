title: 复杂嵌套校验失败时，自动重试的边界在哪里？
body: 现有资料证明了类型化输出的基本能力，但还没有说清多层嵌套 Schema 出错时由谁触发重试、最多重试几次，以及失败信息能否完整进入 trace。
